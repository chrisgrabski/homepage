<!doctype html>
<!-- Template for the link preview images (og-en.png, og-pl.png) and apple-touch-icon.png.
     Generate with: node src/make_images.mjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "NF"; src: url("../fonts/JetBrainsMonoNerdFont-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "NF"; src: url("../fonts/JetBrainsMonoNerdFont-Regular.ttf"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #f4f4f2; color: #2b2a27; font-family: "NF", monospace;
         display: grid; place-items: center; }
  .card { display: flex; align-items: flex-start; gap: 44px; }
  svg { width: 236px; height: 250px; fill: #2b2a27; }
  h1 { font-size: 74px; line-height: 1; letter-spacing: -0.02em; margin-top: -8px; }
  p { margin-top: 30px; font-size: 26px; color: #6c6a65; }
  p span { opacity: .5; }
  .mail { margin-top: 44px; font-size: 30px; color: #c2410c; }
  .mail i { display: inline-block; width: .55em; height: .1em; background: #c2410c; margin-left: .15em; }
  body.icon { width: 180px; height: 180px; }
  body.icon svg { width: 113px; height: 120px; }
  body.icon .text { display: none; }
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 84.937576 90.064362"><g transform="translate(-49.415152,-87.284949)">
      <path d="M 134.07535,119.18564 104.2089,87.284949 68.979451,116.41167 v 24.876 l 35.969179,35.96918 29.4041,-28.84932 V 132.60519 H 95.979451 l 8.153989,13.23541 h 15.60971 l -13.74323,13.60453 -23.428003,-23.42801 v -14.6123 l 20.111303,-16.22775 12.6626,13.73117 z"/>
      <path d="M 64.964982,87.472602 V 177.34931 L 49.415152,165.14694 V 100.60066 Z"/>
    </g></svg>
    <div class="text">
      <h1 id="name"></h1>
      <p id="role"></p>
      <div class="mail">chris.grabski.dev@gmail.com<i></i></div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("icon")) document.body.classList.add("icon");
    document.getElementById("name").textContent = q.get("lang") === "pl" ? "Krzysztof Grabski" : "Christopher Grabski";
    document.getElementById("role").innerHTML = q.get("lang") === "pl"
      ? 'architekt oprogramowania <span>/</span> fullstack <span>/</span> devops'
      : 'software architect <span>/</span> fullstack <span>/</span> devops';
  </script>
</body>
</html>
